<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.css" />
<div class="container p-3">
  <p>Первый поток</p>
  <button class="btn btn-primary" (click)="getCounter()">Запустить получение данных</button><br>
  <button class="btn btn-primary" *ngIf="enableStopButton" (click)="stopSubs()">Остановить поток данных</button>
  <p *ngFor="let count of counterService.counterArray">{{ count }}</p>
</div>
