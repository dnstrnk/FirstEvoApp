<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.css" />
<div class="container">
  <div class="row">
    <div class="col-md-12 d-flex justify-content-center">
      <button class="btn btn-primary" (click)="getCounterAll()">Запустить два потока</button>
    </div>
    <div class="col-md-6">
        <p class="d-flex justify-content-center">Первый поток (подряд)</p>
        <button class="btn btn-primary" (click)="getCounter()">Запустить получение данных</button>
        <button class="btn btn-primary" (click)="stopSubs()">Остановить поток данных</button>
        <p class="d-flex justify-content-center" *ngFor="let count of array">{{ count }}</p>
    </div>
    <div class="col-md-6">
      <p class="d-flex justify-content-center">Второй поток (случайное 0-1000)</p>
      <button class="btn btn-primary" (click)="getCounterR()">Запустить получение случайных данных</button>
      <button class="btn btn-primary" (click)="stopSubsR()">Остановить поток данных</button>
      <p class="d-flex justify-content-center" *ngFor="let countR of arrayR">{{ countR }}</p>
    </div>
  </div>
</div>
